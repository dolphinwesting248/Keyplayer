<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340">
  <defs>
    <linearGradient id="keyNorm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ece6"/>
      <stop offset="100%" stop-color="#e4ded6"/>
    </linearGradient>
    <linearGradient id="keyTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3efe9"/>
      <stop offset="100%" stop-color="#e9e3db"/>
    </linearGradient>
  </defs>

  <rect width="900" height="340" rx="12" fill="#f6f3ed"/>
  <rect x="2" y="2" width="896" height="336" rx="11" fill="none" stroke="#ddd5ca" stroke-width="1.5"/>

  <!-- Row 1: number/symbol row -->
  <g transform="translate(20, 16)">
    <!-- Mode ` -->
    <rect x="0" y="0" width="40" height="34" rx="5" fill="#e8ddf0" stroke="#9b7bb8" stroke-width="2"/>
    <text x="20" y="21" text-anchor="middle" fill="#5a3d7a" font-size="11" font-family="system-ui,sans-serif" font-weight="700">`</text>
    <g font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" fill="#8b857d">
      <rect x="44" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="64" y="21" fill="#3d5f8a" font-weight="700">1</text>
      <rect x="88" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="108" y="21" fill="#3d5f8a" font-weight="700">2</text>
      <rect x="132" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="152" y="21" fill="#3d5f8a" font-weight="700">3</text>
      <rect x="176" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="196" y="21" fill="#3d5f8a" font-weight="700">4</text>
      <rect x="220" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="240" y="21" fill="#3d5f8a" font-weight="700">5</text>
      <rect x="264" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="284" y="21" fill="#3d5f8a" font-weight="700">6</text>
      <rect x="308" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="328" y="21" fill="#3d5f8a" font-weight="700">7</text>
      <rect x="352" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="372" y="21" fill="#3d5f8a" font-weight="700">8</text>
      <rect x="396" y="0" width="40" height="34" rx="5" fill="#eaf1f7" stroke="#5b7fba" stroke-width="2"/><text x="416" y="21" fill="#3d5f8a" font-weight="700">9</text>
      <rect x="440" y="0" width="40" height="34" rx="5" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/><text x="460" y="21">0</text>
      <!-- Volume -->
      <rect x="484" y="0" width="40" height="34" rx="5" fill="#d5eadc" stroke="#5a8d6e" stroke-width="2"/><text x="504" y="21" fill="#2d5a3d" font-weight="700">-</text>
      <rect x="528" y="0" width="40" height="34" rx="5" fill="#d5eadc" stroke="#5a8d6e" stroke-width="2"/><text x="548" y="21" fill="#2d5a3d" font-weight="700">=</text>
    </g>
  </g>

  <!-- Row 2: QWERTY -->
  <g transform="translate(20, 54)">
    <rect x="0" y="0" width="55" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="27" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Tab</text>
    <g font-size="12" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">
      <rect x="59"  y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="81"  y="26" fill="#8b3a1a">Q</text>
      <rect x="107" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="129" y="26" fill="#8b3a1a">W</text>
      <rect x="155" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="177" y="26" fill="#8b3a1a">E</text>
      <rect x="203" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="225" y="26" fill="#8b3a1a">R</text>
      <rect x="251" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="273" y="26" fill="#8b3a1a">T</text>
      <rect x="299" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="321" y="26" fill="#8b3a1a">Y</text>
      <rect x="347" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="369" y="26" fill="#8b3a1a">U</text>
      <rect x="395" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="417" y="26" fill="#8b3a1a">I</text>
      <rect x="443" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="465" y="26" fill="#8b3a1a">O</text>
      <rect x="491" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="513" y="26" fill="#8b3a1a">P</text>
      <rect x="539" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="561" y="26" fill="#8b3a1a">[</text>
      <rect x="587" y="0" width="44" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/><text x="609" y="26" fill="#8b3a1a">]</text>
      <rect x="635" y="0" width="44" height="42" rx="6" fill="#e8ddd0" stroke="#8b7355" stroke-width="2"/><text x="657" y="26" fill="#5b3a1a" font-weight="600">\</text>
    </g>
  </g>

  <!-- Row 3: ASDF -->
  <g transform="translate(20, 100)">
    <rect x="0" y="0" width="68" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="34" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Caps</text>
    <g font-size="12" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">
      <rect x="72"  y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="94"  y="26" fill="#8b2828">A</text>
      <rect x="120" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="142" y="26" fill="#8b2828">S</text>
      <rect x="168" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="190" y="26" fill="#8b2828">D</text>
      <rect x="216" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="238" y="26" fill="#8b2828">F</text>
      <rect x="264" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="286" y="26" fill="#8b2828">G</text>
      <rect x="312" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="334" y="26" fill="#8b2828">H</text>
      <rect x="360" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="382" y="26" fill="#8b2828">J</text>
      <rect x="408" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="430" y="26" fill="#8b2828">K</text>
      <rect x="456" y="0" width="44" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/><text x="478" y="26" fill="#8b2828">L</text>
      <!-- Instrument ; -->
      <rect x="504" y="0" width="44" height="42" rx="6" fill="#d5eadc" stroke="#5a8d6e" stroke-width="2"/><text x="526" y="26" fill="#2d5a3d">;</text>
      <!-- Record ' -->
      <rect x="552" y="0" width="44" height="42" rx="6" fill="#fad5cc" stroke="#e08870" stroke-width="2"/><text x="574" y="26" fill="#a04030" font-weight="600">'</text>
    </g>
    <rect x="600" y="0" width="79" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="639" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Enter</text>
  </g>

  <!-- Row 4: ZXCV -->
  <g transform="translate(20, 146)">
    <!-- Shift (velocity) -->
    <rect x="0" y="0" width="83" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/>
    <text x="41" y="26" text-anchor="middle" fill="#8b3a1a" font-size="11" font-family="system-ui,sans-serif" font-weight="600">Shift</text>
    <g font-size="12" font-family="system-ui,sans-serif" text-anchor="middle" font-weight="600">
      <rect x="87"  y="0" width="44" height="42" rx="6" fill="#f0e6cc" stroke="#c49a6c" stroke-width="2"/><text x="109" y="26" fill="#6b4d20">Z</text>
      <rect x="135" y="0" width="44" height="42" rx="6" fill="#f0e6cc" stroke="#c49a6c" stroke-width="2"/><text x="157" y="26" fill="#6b4d20">X</text>
      <rect x="183" y="0" width="44" height="42" rx="6" fill="#f0e6cc" stroke="#c49a6c" stroke-width="2"/><text x="205" y="26" fill="#6b4d20">C</text>
      <rect x="231" y="0" width="44" height="42" rx="6" fill="#f0e6cc" stroke="#c49a6c" stroke-width="2"/><text x="253" y="26" fill="#6b4d20">V</text>
      <rect x="279" y="0" width="44" height="42" rx="6" fill="#f0e6cc" stroke="#c49a6c" stroke-width="2"/><text x="301" y="26" fill="#6b4d20">B</text>
      <rect x="327" y="0" width="44" height="42" rx="6" fill="#f0e6cc" stroke="#c49a6c" stroke-width="2"/><text x="349" y="26" fill="#6b4d20">N</text>
      <rect x="375" y="0" width="44" height="42" rx="6" fill="#f0e6cc" stroke="#c49a6c" stroke-width="2"/><text x="397" y="26" fill="#6b4d20">M</text>
    </g>
    <g font-size="10" font-family="system-ui,sans-serif" text-anchor="middle" fill="#8b857d">
      <rect x="423" y="0" width="44" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/><text x="445" y="26">,</text>
      <rect x="471" y="0" width="44" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/><text x="493" y="26">.</text>
      <rect x="519" y="0" width="44" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/><text x="541" y="26">/</text>
    </g>
    <rect x="567" y="0" width="112" height="42" rx="6" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="2"/>
    <text x="623" y="26" text-anchor="middle" fill="#8b3a1a" font-size="11" font-family="system-ui,sans-serif" font-weight="600">Shift</text>
  </g>

  <!-- Row 5: Bottom row -->
  <g transform="translate(20, 192)">
    <rect x="0" y="0" width="64" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="32" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Ctrl</text>
    <rect x="68" y="0" width="64" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="100" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Win</text>
    <rect x="136" y="0" width="64" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="168" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Alt</text>
    <!-- Space · Sustain -->
    <rect x="204" y="0" width="332" height="42" rx="6" fill="#f5d8d5" stroke="#c4554d" stroke-width="2"/>
    <text x="370" y="26" text-anchor="middle" fill="#8b2828" font-size="12" font-family="system-ui,sans-serif" font-weight="700">SPACE</text>
    <rect x="540" y="0" width="64" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="572" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Alt</text>
    <rect x="608" y="0" width="64" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="640" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Win</text>
    <rect x="676" y="0" width="64" height="42" rx="6" fill="url(#keyNorm)" stroke="#ddd5ca" stroke-width="1"/>
    <text x="708" y="26" text-anchor="middle" fill="#8b857d" font-size="10" font-family="system-ui,sans-serif">Ctrl</text>
  </g>

  <!-- Legend -->
  <g transform="translate(24, 254)" font-family="system-ui, sans-serif">
    <text x="0" y="14" fill="#8b857d" font-size="11" font-weight="600">Legend</text>

    <rect x="0"   y="24" width="14" height="14" rx="3" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="1.5"/><text x="20"  y="36" fill="#7a6e64" font-size="11">QWERTYUIOP</text>
    <rect x="148" y="24" width="14" height="14" rx="3" fill="#f5d8d5" stroke="#c4554d" stroke-width="1.5"/><text x="168" y="36" fill="#7a6e64" font-size="11">ASDFGHJKL</text>
    <rect x="286" y="24" width="14" height="14" rx="3" fill="#f0e6cc" stroke="#c49a6c" stroke-width="1.5"/><text x="306" y="36" fill="#7a6e64" font-size="11">ZXCVBNM</text>
    <rect x="416" y="24" width="14" height="14" rx="3" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="1.5"/><text x="436" y="36" fill="#7a6e64" font-size="11">[ ] Octave</text>
    <rect x="546" y="24" width="14" height="14" rx="3" fill="#e8ddf0" stroke="#9b7bb8" stroke-width="1.5"/><text x="566" y="36" fill="#7a6e64" font-size="11">` Mode</text>
    <rect x="656" y="24" width="14" height="14" rx="3" fill="#d5eadc" stroke="#5a8d6e" stroke-width="1.5"/><text x="676" y="36" fill="#7a6e64" font-size="11">- = Volume</text>
    <rect x="788" y="24" width="14" height="14" rx="3" fill="#f5d8d5" stroke="#c4554d" stroke-width="1.5"/><text x="808" y="36" fill="#7a6e64" font-size="11">Space</text>

    <!-- Row 2 -->
    <rect x="0"   y="46" width="14" height="14" rx="3" fill="#f5e0cc" stroke="#bc6a3a" stroke-width="1.5"/><text x="20"  y="59" fill="#7a6e64" font-size="11">Shift Velocity</text>
    <rect x="166" y="46" width="14" height="14" rx="3" fill="#d5eadc" stroke="#5a8d6e" stroke-width="1.5"/><text x="186" y="59" fill="#7a6e64" font-size="11">; Instrument</text>
    <rect x="320" y="46" width="14" height="14" rx="3" fill="#e8ddd0" stroke="#8b7355" stroke-width="1.5"/><text x="340" y="59" fill="#7a6e64" font-size="11">\\ Reverb</text>
    <rect x="440" y="46" width="14" height="14" rx="3" fill="#fad5cc" stroke="#e08870" stroke-width="1.5"/><text x="460" y="59" fill="#7a6e64" font-size="11">' Record</text>
    <rect x="560" y="46" width="14" height="14" rx="3" fill="#eaf1f7" stroke="#5b7fba" stroke-width="1.5"/><text x="580" y="59" fill="#7a6e64" font-size="11">1-9 Instrument</text>
  </g>
</svg>
